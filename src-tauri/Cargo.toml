[package]
name = "vale-studio-desktop"
version = "0.1.2"
description = "Vale Studio Desktop"
authors = ["Vale Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "vale_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vale-studio-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
